[workspace]
resolver = "2"
members = [
    "crates/flip-proto",
    "crates/flip-core",
    "crates/flip-daemon",
    "crates/flip-client",
    "crates/flip-cli",
]
exclude = ["firmware"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serialport = "4"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
